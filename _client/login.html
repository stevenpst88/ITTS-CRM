<!DOCTYPE html>
<html lang="zh-TW" data-mode="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050914">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ITTS CRM">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <title>登入 - 東捷資訊業務管理系統</title>
  <link rel="stylesheet" href="/login-cinematic.css">
  <!-- 先把主題／明暗套到 <html>（同步、很小），避免淺色使用者先閃一下深色 -->
  <script src="/login-boot.js"></script>
</head>
<body>
<canvas id="gl" class="bgc" aria-hidden="true"></canvas>
<canvas id="lite" class="bgc" aria-hidden="true" hidden></canvas>
<svg id="logoSvg" class="logo-svg" viewBox="4 16 100 34" aria-hidden="true" focusable="false"><text class="t" x="8" y="40" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="28" letter-spacing="1">ITTS</text></svg>
<p class="tagline" id="tagline"></p>
<p class="tag-sub" id="tagSub">ITTS · BUSINESS MANAGEMENT SYSTEM</p>
<div class="ring" id="ring" aria-hidden="true"></div>
<div class="flash" id="flash" aria-hidden="true"></div>
<main class="stage">
  <section class="card" id="card" aria-labelledby="ttl">
    <header class="brand">
      <svg viewBox="2 16 100 34" role="img" aria-label="ITTS" focusable="false"><text class="t" x="8" y="40" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="28" letter-spacing="1">ITTS</text></svg>
      <h1 id="ttl">東捷資訊業務管理系統</h1>
      <p>Business Management System</p>
    </header>
    <div class="error-msg" id="errorMsg" role="alert" aria-live="assertive">帳號或密碼錯誤，請重新輸入</div>
    <!-- method/action 只是保險：JS 萬一沒載入時，原生送出也不會把密碼放進網址列 -->
    <form id="loginForm" method="post" action="/login.html" autocomplete="on">
      <div class="fld">
        <label for="username">帳　號</label>
        <div class="pill" id="pillU">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.2 3.6-7 8-7s8 2.8 8 7"/></svg>
          <input type="text" id="username" name="username" placeholder="請輸入帳號" autocomplete="username" required>
        </div>
      </div>
      <div class="fld">
        <label for="password">密　碼</label>
        <div class="pill" id="pillP">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg>
          <input type="password" id="password" name="password" placeholder="請輸入密碼" autocomplete="current-password" required>
          <button type="button" class="eye" id="eyeBtn" aria-label="顯示密碼" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
        </div>
        <div class="caps" id="capsHint" hidden>⇪ 大寫鎖定已開啟</div>
      </div>
      <button type="submit" class="login-btn" id="loginBtn"><span class="spin" aria-hidden="true"></span><span id="btnLbl">登　入</span></button>
    </form>
    <noscript><p class="footer-note">需要啟用 JavaScript 才能登入。</p></noscript>
    <p class="footer-note">© 東捷資訊服務股份有限公司</p>
  </section>
</main>
<nav class="dock" id="dock" aria-label="色彩主題與明暗模式"></nav>

<div class="skip" id="skip" aria-hidden="true">點擊任一處或按任意鍵跳過</div>
<div id="fade" aria-hidden="true"></div>
<div id="done" role="status" aria-live="polite"><div><b>登入成功</b><span>正在進入系統…</span></div></div>

<!-- 信件深層連結暫存（簽核信 → /q/<id> → 這裡 → 登入後回到該單）。/deep-link.js 是公開路由；載入失敗只是少了這個功能，不影響登入 -->
<script src="/deep-link.js"></script>
<script src="/login-cinematic.js"></script>
</body>
</html>
